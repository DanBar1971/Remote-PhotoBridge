name: Build and publish Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remote-photobridge-alpha-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35 build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile test APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare release APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Remote-PhotoBridge-v1.0.0-alpha1-debug.apk
          sha256sum Remote-PhotoBridge-v1.0.0-alpha1-debug.apk
      - name: Keep Actions build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Remote-PhotoBridge-v1.0.0-alpha1-debug
          path: Remote-PhotoBridge-v1.0.0-alpha1-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v1.0.0-alpha1"
          apk="Remote-PhotoBridge-v1.0.0-alpha1-debug.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "Remote PhotoBridge v1.0.0-alpha1" --notes "Primeira versão experimental Android. Principal: só recebe fotografias. Secundário: só envia. Ligação local por Wi-Fi Direct, sem Internet. APK debug de testes, ainda não validado em dois dispositivos físicos." --prerelease
          fi
          gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$apk"
          echo "Release publicada e APK confirmado em:"
          gh release view "$tag" --json url --jq '.url'
      - name: Record confirmed release for maintainers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          url="$(gh release view v1.0.0-alpha1 --json url --jq '.url')"
          cat > RELEASE_STATUS.md <<EOF
          # Remote PhotoBridge — APK de testes

          Release verificada pelo workflow: $url

          APK: `Remote-PhotoBridge-v1.0.0-alpha1-debug.apk`

          SHA-256: `$(sha256sum Remote-PhotoBridge-v1.0.0-alpha1-debug.apk | cut -d' ' -f1)`

          Compilação inicial para testes. O Wi-Fi Direct entre telemóveis reais ainda precisa de validação.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RELEASE_STATUS.md
          git commit -m "docs: verify published alpha APK in GitHub Releases"
          git push origin HEAD:main
