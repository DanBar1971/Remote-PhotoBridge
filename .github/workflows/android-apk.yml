name: Build and publish Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remote-photobridge-alpha-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 without obsolete tools package
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager_path" ]; then
            sdkmanager_path="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          fi
          test -n "$sdkmanager_path"
          echo "Using $sdkmanager_path"
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile test APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug --stacktrace 2>&1 | tee android-build.log
      - name: Prepare release APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Remote-PhotoBridge-v1.0.0-alpha1-debug.apk
          sha256sum Remote-PhotoBridge-v1.0.0-alpha1-debug.apk
      - name: Keep Actions build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Remote-PhotoBridge-v1.0.0-alpha1-debug
          path: Remote-PhotoBridge-v1.0.0-alpha1-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v1.0.0-alpha1"
          apk="Remote-PhotoBridge-v1.0.0-alpha1-debug.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "Remote PhotoBridge v1.0.0-alpha1" --notes "Primeira versão experimental Android. Principal: só recebe fotografias. Secundário: só envia. Ligação local por Wi-Fi Direct, sem Internet. APK debug de testes, ainda não validado em dois dispositivos físicos." --prerelease
          fi
          gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$apk"
          echo "Release publicada e APK confirmado em:"
          gh release view "$tag" --json url --jq '.url'
      - name: Record confirmed release for maintainers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          url="$(gh release view v1.0.0-alpha1 --json url --jq '.url')"
          cat > RELEASE_STATUS.md <<EOF
          # Remote PhotoBridge — APK de testes

          Release verificada pelo workflow: $url

          APK: `Remote-PhotoBridge-v1.0.0-alpha1-debug.apk`

          SHA-256: `$(sha256sum Remote-PhotoBridge-v1.0.0-alpha1-debug.apk | cut -d' ' -f1)`

          Compilação inicial para testes. O Wi-Fi Direct entre telemóveis reais ainda precisa de validação.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f BUILD_FAILURE.md ]; then git rm -f BUILD_FAILURE.md; fi
          git add RELEASE_STATUS.md
          git commit -m "docs: verify published alpha APK in GitHub Releases"
          git push origin HEAD:main
      - name: Save failure details to repository
        if: failure()
        shell: bash
        run: |
          {
            echo '# Falha na compilação/publicação do APK'
            echo
            echo "Workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Commit: ${GITHUB_SHA}"
            echo
            echo 'Últimas linhas do Gradle (quando disponíveis):'
            echo '~~~text'
            if [ -f android-build.log ]; then tail -n 100 android-build.log; else echo 'A falha aconteceu antes do Gradle ou na fase de publicação.'; fi
            echo '~~~'
          } > BUILD_FAILURE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_FAILURE.md
          git commit -m "ci: record Android build or release failure"
          git push origin HEAD:main
