name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish staged Android project on first build
        shell: bash
        run: |
          if [ -d .seed ]; then
            cat .seed/part{1,2,3,4}.b64 | base64 -d | tar -xJf -
            git rm -r .seed
            git add -A
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "feat: publish Remote PhotoBridge Android alpha source"
            git push origin HEAD:main
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK test artifact
        uses: actions/upload-artifact@v4
        with:
          name: Remote-PhotoBridge-v1.0.0-alpha1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
