name: Build and publish Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remote-photobridge-production-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 without obsolete tools package
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager_path" ]; then
            sdkmanager_path="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          fi
          test -n "$sdkmanager_path"
          echo "Using $sdkmanager_path"
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore protected signing key (same certificate every release)
        shell: bash
        env:
          RPB_SIGNING_BUNDLE: ${{ secrets.RPB_ANDROID_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          if [ -z "${RPB_SIGNING_BUNDLE:-}" ]; then
            echo "::error::Missing RPB_ANDROID_SIGNING_BUNDLE GitHub Actions secret; configure it using SIGNING_SETUP.md. Release blocked."
            exit 1
          fi
          umask 077
          printf '%s' "$RPB_SIGNING_BUNDLE" | base64 --decode | tar --extract --gzip --no-same-owner --file -
          test -s app/signing/remotephotobridge-alpha.p12
          test -s local-signing.properties
          echo "Signing bundle restored privately; key bytes never shown in logs."
      - name: Run tests and compile signed production APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest assembleRelease --stacktrace 2>&1 | tee android-build.log
      - name: Prepare release APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk Remote-PhotoBridge-v1.0.0.apk
          sha256sum Remote-PhotoBridge-v1.0.0.apk
          # Refuse to release anything signed with the ephemeral runner debug key.
          apksigner="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0/apksigner"
          test -x "$apksigner"
          cert="$("$apksigner" verify --print-certs Remote-PhotoBridge-v1.0.0.apk |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          expected="cf7b070bc2622c2f48aa71d7d08f9f572dff04d1d5e547b29d201f24c6761f47"
          echo "Certificate SHA-256: $cert"
          if [ "$cert" != "$expected" ]; then
            echo "::error::APK signer mismatch. Publishing blocked to protect future in-place updates."
            exit 1
          fi
      - name: Keep Actions build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Remote-PhotoBridge-v1.0.0-release
          path: Remote-PhotoBridge-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v1.0.0"
          apk="Remote-PhotoBridge-v1.0.0.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$apk"; then
              echo "APK already published for this version. Refusing to overwrite with another debug signature."
              exit 1
            fi
            gh release upload "$tag" "$apk"
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "Remote PhotoBridge 1.0.0" --notes "Primeira versão estável da Remote PhotoBridge. Menu principal Câmara, Galeria, Partilhar e Opções. Câmara e Galeria abrem as aplicações originais do Android, guardando e mostrando todas as fotos pela própria aplicação de sistema. Partilhar usa Nearby Connections sem Internet, Principal apenas recebe, Secundário apenas envia as fotos de Hoje/3/7/14/30 dias. Opções permite alterar Principal/Secundário, gerir permissões do Android, ver Acerca, apoio ao autor (Buy Me a Coffee/PayPal) e Contactar Suporte pelo mesmo endereço da SaúdePrática. APK Android release, não debug, versionCode 100, assinado pela chave fixa de versões anteriores para instalar por cima da alpha12." --latest
          fi
          gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$apk"
          echo "Release publicada e APK confirmado em:"
          gh release view "$tag" --json url --jq '.url'
      - name: Record confirmed release for maintainers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          url="$(gh release view v1.0.0 --json url --jq '.url')"
          cat > RELEASE_STATUS.md <<EOF
          # Remote PhotoBridge — APK de testes

          Release verificada pelo workflow: $url

          APK: Remote-PhotoBridge-v1.0.0.apk

          SHA-256: $(sha256sum Remote-PhotoBridge-v1.0.0.apk | cut -d' ' -f1)

          Versão 1.0.0: APK release não-debug, Câmara e Galeria nativas, menu principal, opções de perfil, permissões e suporte. Nearby unidirecional e assinatura fixa mantidos desde alpha8.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f BUILD_FAILURE.md ]; then git rm -f BUILD_FAILURE.md; fi
          git add RELEASE_STATUS.md
          git commit -m "docs: verify published stable 1.0.0 APK in GitHub Releases [skip ci]"
          git push origin HEAD:main
      - name: Save failure details to repository
        if: failure()
        shell: bash
        run: |
          {
            echo '# Falha na compilação/publicação do APK'
            echo
            echo "Workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Commit: ${GITHUB_SHA}"
            echo
            echo 'Últimas linhas do Gradle (quando disponíveis):'
            echo '~~~text'
            if [ -f android-build.log ]; then tail -n 100 android-build.log; else echo 'A falha aconteceu antes do Gradle ou na fase de publicação.'; fi
            echo '~~~'
          } > BUILD_FAILURE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_FAILURE.md
          git commit -m "ci: record Android build or release failure"
          git push origin HEAD:main
