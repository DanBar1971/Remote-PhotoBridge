name: Validate Android PR
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'settings.gradle.kts'
      - '.github/workflows/validate-android-pr.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          set -e
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unit tests and debug compilation (no private signing key)
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Keep verification APK private to Actions
        uses: actions/upload-artifact@v4
        with:
          name: PhotoBridge-PR-validation
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5
